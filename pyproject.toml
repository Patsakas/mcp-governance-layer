[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-governance-layer"
version = "0.1.0"
description = "MCP-Native AI Governance Layer with Human-in-the-Loop (HITL) enforcement"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Pinned to 1.x: the 2.x SDK removed the low-level Server decorator API
    # (@server.list_tools / @server.call_tool) that app/mcp_tools.py uses.
    "mcp[cli]>=1.9.0,<2.0.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.2.0",
    "anyio>=4.4.0",
    "python-multipart>=0.0.9",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
